[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planar-arm-2dof-discrete-pid"
version = "1.0.0"
description = "Discrete-time dual-joint PID controller and 2-DOF planar robotic arm kinematics simulator (LabVIEW VI + Python/NumPy)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
planar-arm-pid = "planar_arm_pid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
